<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เริ่มต้นใช้แฟคเตอร์</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f0f7;--card:#fff;--ink:#12263f;--mut:#5d6f86;--line:#c9d4e0;--g:#0f7b6c;--gb:#d8f0eb;--y:#f5b82e;--yb:#fff4cf;--red:#d9534f;--ok:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1824;--card:#16253a;--ink:#e8eef6;--mut:#9fb0c5;--line:#34475f;--g:#4fd1bb;--gb:#14403f;--y:#e0a82a;--yb:#3a3216;--red:#ff7b76;--ok:#4cd68a}}
:root[data-theme="dark"]{--bg:#0e1824;--card:#16253a;--ink:#e8eef6;--mut:#9fb0c5;--line:#34475f;--g:#4fd1bb;--gb:#14403f;--y:#e0a82a;--yb:#3a3216;--red:#ff7b76;--ok:#4cd68a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;padding:10px;line-height:1.45;font-size:13px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:1.35rem;margin:2px 0 8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.meta{color:var(--mut);font-size:.78rem}.bar{height:6px;background:var(--line);border-radius:9px;margin:6px 0 10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.q{font-size:1rem;font-weight:700;margin:8px 0 10px;line-height:2}
.facts{background:var(--yb);border:1px solid var(--y);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center}
.fg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.fg+.fg{margin-left:10px;padding-left:10px;border-left:2px solid var(--y)}
.eq{color:var(--mut);font-weight:700}
.chip{border:2px solid var(--y);background:var(--card);border-radius:999px;padding:1px 9px;font-weight:700;font-size:.9rem;cursor:grab;display:inline-block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;white-space:nowrap}
.chip.sel{outline:3px solid var(--g)}
.ghost{position:fixed;z-index:99;pointer-events:none;box-shadow:0 6px 16px #0004;transform:translate(-50%,-50%)}
.expr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0}
.lab{border:2px solid var(--g);border-radius:12px;padding:3px 8px;font-size:.85rem;font-weight:700;color:var(--g)}
.box{background:var(--gb);border:2px solid var(--g);border-radius:10px;min-height:34px;padding:3px 8px;font-size:.88rem;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;min-width:80px}
.slot{cursor:pointer;border-style:dashed}.slot.empty{background:transparent;color:var(--mut);font-weight:400;font-size:.8rem}.slot.over{background:var(--yb)}
.op{color:var(--mut);font-weight:700;font-size:1.2rem}
.fr{display:flex;flex-direction:column;gap:6px;align-items:stretch}.fr hr{border:0;border-top:3px solid var(--ink);margin:0;width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
button{font:inherit;font-weight:700;border-radius:12px;padding:8px 14px;font-size:.9rem;cursor:pointer;border:2px solid var(--g)}
.pri{background:var(--g);color:var(--card)}.pri:disabled{opacity:.4;cursor:default}.sec{background:var(--card);color:var(--g)}
.res{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.95rem;margin:8px 0;overflow-x:auto}
.cf{display:inline-flex;flex-direction:column;align-items:center}.cf hr{border:0;border-top:2px solid var(--ink);width:100%;margin:3px 0}
.cf .row{display:flex;gap:6px;align-items:center;padding:0 4px;white-space:nowrap}
.u{position:relative;display:inline-block;background:var(--yb);border:1.5px solid var(--y);border-radius:7px;padding:0 6px;margin-left:3px}
.u.c{color:var(--mut)}.u.c::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:3px;background:var(--red);border-radius:2px}
.u.a{animation:hl .9s var(--d) both}.u.a::after{animation:ln .4s calc(var(--d) + .5s) both;transform-origin:left}
@keyframes hl{0%{background:var(--yb);transform:scale(1);color:var(--ink)}35%{background:var(--pc);transform:scale(1.4);color:#000;border-color:var(--pc)}100%{background:var(--yb);transform:scale(1);color:var(--mut)}}
@keyframes ln{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fade{animation:fd .5s var(--d) both}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
.chip.gv{border-color:var(--g);background:var(--gb);color:var(--g)}
.sc{margin-left:8px;background:var(--gb);color:var(--g);border-radius:999px;padding:1px 10px;font-weight:700}
.nm{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:min(320px,90%);text-align:center}
.msg{font-size:.88rem;padding:8px 10px;border-radius:12px;margin:8px 0;font-weight:600}.bad{background:#d9534f22;color:var(--red)}.good{background:#1f9d5522;color:var(--ok)}
.ch{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.ch button{background:var(--card);color:var(--ink);border:2px solid var(--line);padding:12px 6px;font-size:.95rem}
.ch button.w{border-color:var(--red);color:var(--red);opacity:.6}.ch button.r{border-color:var(--ok);background:#1f9d5522}
.big{text-align:center;padding:30px 0}.big b{font-size:1.5rem;color:var(--g)}
</style></head><body><div class="wrap"><h1>เริ่มต้นใช้แฟคเตอร์</h1><div class="panel" id="app"></div></div>
<script>
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup=s=>String(s).replace(/./g,c=>SUP[c]||c);
const dv=s=>s.replace(/x/g,' × ').replace(/\^(-?\d+)/g,(_,e)=>sup(e));
const pv=s=>s.split('x').reduce((a,p)=>a*(p.includes('^')?Math.pow(+p.split('^')[0],+p.split('^')[1]):parseFloat(p.replace(/,/g,''))),1);
const mk=(s,f)=>{const i=s.indexOf(' ');const v=s.slice(0,i);return{d:dv(v),n:pv(v),u:s.slice(i+1),f}};
const K=["1 kg","10^3 g"],MG=["1 mg","10^-3 g"],UG=["1 µg","10^-6 g"],UL=["1 µl","10^-6 l"],ML=["1 ml","10^-3 l"],RHO=["1.15 kg","1 l"];
const PAY=["100 คนทั้งหมด","85 คนยังไม่จ่าย","15 คนจ่ายแล้ว"];
const AL=[K,MG,UG,ML,UL],AR=[...AL,RHO],FEE=["1 คนจ่ายแล้ว","1000 บาท"];
const P=[
{s:1,q:"ของสิ่งหนึ่งมวล {g} เท่ากับกี่ kg",g:"65,000 g",t:"kg",n:1,f:AL},
{s:1,q:"ของสิ่งหนึ่งมวล {g} เท่ากับกี่ g",g:"25,000 mg",t:"g",n:1,f:AL},
{s:1,q:"น้ำ {g} เท่ากับกี่ µg",g:"8 g",t:"µg",n:1,f:AL},
{s:1,q:"น้ำ {g} เท่ากับกี่ l",g:"100 µl",t:"l",n:1,f:AL},
{s:1,q:"ความหนาแน่นสารละลายน้ำเกลือคือ 1.15 kg/l ถ้าตวงสารละลายน้ำเกลือมา {g} จะมีมวลเท่ากับกี่ kg",g:"0.75 l",t:"kg",n:1,f:AR},
{s:1,q:"ถ้าโรงเรียนมีนักเรียน {g} มีคนชำระค่าเทอมแล้วกี่คน (ไม่จ่ายร้อยละ 85)",g:"3,440 คนทั้งหมด",t:"คนจ่ายแล้ว",n:1,f:[PAY]},
{s:1,q:"ถ้านักเรียน ม.4 มี {g} มีคนค้างชำระค่าเทอมกี่คน (ไม่จ่ายร้อยละ 85)",g:"384 คนทั้งหมด",t:"คนยังไม่จ่าย",n:1,f:[PAY]},
{s:1,q:"จากข้อ 7 ถ้านักเรียน ม.4 มี {g} ค่าเทอมคนละ 1,000 บาท โรงเรียนยังไม่ได้รับค่าเทอมจากนักเรียน ม.4 ทั้งหมดกี่บาท",g:"384 คนทั้งหมด",t:"บาท",n:2,f:[PAY,["1 คนยังไม่จ่าย","1000 บาท"]]},
{s:2,q:"สารเคมีชนิดหนึ่งมวล {g} จะมีมวลเท่ากับกี่ kg",g:"4.5x10^7 mg",t:"kg",n:2,f:AL},
{s:2,q:"สารละลายน้ำเกลือมีความหนาแน่น 1.15 kg/l ปริมาตร {g} คิดเป็นปริมาตรกี่ ml",g:"2,500 µl",t:"ml",n:2,f:AR},
{s:2,q:"สารละลายน้ำเกลือมีความหนาแน่น 1.15 kg/l หากต้องการสารละลายน้ำเกลือมวล {g} จะต้องตวงมากี่ ml",g:"2,300 g",t:"ml",n:3,f:AR},
{s:2,q:"ถ้านักเรียนทั้งหมด {g} โรงเรียนได้รับค่าบำรุงการศึกษาแล้วกี่บาท (จ่ายแล้วร้อยละ 15, 1 คน = 1,000 บาท)",g:"3,400 คนทั้งหมด",t:"บาท",n:2,f:[PAY,FEE]},
{s:2,q:"ถ้าโรงเรียนได้รับค่าบำรุงการศึกษาจากนักเรียน ม.2 มาแล้ว {g} นักเรียน ม.2 มีทั้งหมดกี่คน",g:"90,000 บาท",t:"คนทั้งหมด",n:2,f:[PAY,FEE]},
];
let st;const app=document.getElementById('app');
const COL=['#ffd54a','#7fe0c8','#ff9fb0','#a9c4ff'];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gs=id=>id=='g'?[st,'given']:[st.slots[+id[0]],id[1]];
function init(){st={i:0,score:0,pp:[],op:[],end:0,name:''};load()}
function load(){const p=P[st.i];st.cards=p.f.flatMap((f,fi)=>f.map(s=>mk(s,fi)));st.cards.push(mk(p.g,-1));st.given=null;st.slots=Array.from({length:p.n},()=>({t:null,b:null}));st.sel=null;st.stage=0;st.first=true;st.tries=0;st.pp[st.i]=0;st.op[st.i]=0;st.opts=null;st.wrong=[];st.frac='';st.msg='';st.fresh=false;render()}
function fmt(x){x=Number(x.toPrecision(6));const a=Math.abs(x);if(a>=1e6||(a<1e-3&&a>0)){const e=Math.floor(Math.log10(a));return Number((x/10**e).toPrecision(4))+' × 10'+sup(e)}return x.toLocaleString('en',{maximumFractionDigits:6})}
function render(){
if(st.end==1){app.innerHTML=`<div class="big"><div>ทำครบทุกข้อแล้ว 🎉</div><div class="meta">กรอกชื่อนักเรียนก่อนดูผล</div><p><input id="nm" class="nm" placeholder="ชื่อนักเรียน" maxlength="40" autocomplete="off"></p><button class="pri" id="nmgo">ดูผลคะแนน</button></div>`;return}
if(st.end==2){const pass=st.score>=20,n=esc(st.name);app.innerHTML=`<div class="big"><b>${pass?`เก่งมากกกกก ${n} ผ่านแล้ว`:`อย่าพึ่งยอมแพ้นะ ${n} เราทำได้ ลองอีกที`}</b><div style="font-size:1.5rem;margin:10px 0">${st.score} / ${P.length*2} คะแนน</div><div class="meta">เกณฑ์ผ่านคือ 20 คะแนนขึ้นไป</div></div><div class="btns" style="justify-content:center"><button class="pri" id="rs">${pass?'เริ่มใหม่':'ลองอีกที'}</button></div>`;return}
const p=P[st.i],full=st.given&&st.slots.every(s=>s.t&&s.b),cd=c=>`${c.d} ${c.u}`;
const chips=(fi,cl)=>st.cards.map((c,ci)=>[c,ci]).filter(([c])=>c.f==fi).map(([c,ci])=>`<span class="chip${cl}${st.sel===ci?' sel':''}" data-c="${ci}">${cd(c)}</span>`).join('<span class="eq">=</span>');
const facts=p.f.map((f,fi)=>`<div class="fg">${chips(fi,'')}</div>`).join('');
const slot=id=>{const[o,k]=gs(id),c=o[k];return `<div class="box slot${c?'':' empty'}" data-s="${id}">${c?cd(c):(id=='g'?'วางปริมาณสาร':'ลากการ์ดมาวาง')}</div>`};
const fr=st.slots.map((_,k)=>`<span class="op">×</span><div class="fr">${slot(k+'t')}<hr>${slot(k+'b')}</div>`).join('');
const res=st.stage>=1?st.frac+`<div class="${st.fresh?'fade':''}" style="--d:${st.dl}s">${st.msg}${st.stage==1&&st.ok?optsHtml():''}</div>`:'';
app.innerHTML=`<div class="meta">ตอนที่ ${p.s} · ข้อที่ ${st.i+1} จาก ${P.length} <span class="sc">คะแนนข้อนี้ ${st.pp[st.i]+st.op[st.i]}/2</span></div><div class="bar"><i style="width:${st.i/P.length*100}%"></i></div>
<div class="meta">ลากการ์ดสีเขียวในโจทย์และการ์ดแฟคเตอร์ไปวางในช่อง หรือแตะการ์ดแล้วแตะช่อง · ลากการ์ดใหม่วางทับเพื่อเปลี่ยน · แตะการ์ดที่วางแล้วเพื่อนำออก</div>
<div class="q">${p.q.replace('{g}',chips(-1,' gv'))}</div><div class="facts">${facts}</div>
<div class="expr"><div class="lab">ปริมาณ (${p.t})</div><span class="eq">=</span>${slot('g')}${fr}</div>
<div class="btns"><button class="pri" id="go" ${full&&st.stage<2?'':'disabled'}>ดำเนินการ</button><button class="sec" id="clr" ${st.stage==2?'disabled':''}>ล้างช่องทั้งหมด</button>${st.stage>=1?'<button class="sec" id="rp">▶ ดูการตัดหน่วยอีกครั้ง</button>':''}</div>${res}${st.stage==2?'<div class="btns"><button class="pri" id="nx">'+(st.i+1<P.length?'ข้อถัดไป':'เสร็จสิ้น')+'</button></div>':''}`;
}
function check(){
const p=P[st.i],g=st.given;st.tries++;
const nums=[{d:g.d,u:g.u,c:0}],dens=[];let ok=g.f==-1,val=g.n,rs=[],pi=0;
for(const s of st.slots){if(s.t.f<0||s.t.f!==s.b.f||s.t===s.b)ok=false;nums.push({d:s.t.d,u:s.t.u,c:0});dens.push({d:s.b.d,u:s.b.u,c:0});val*=s.t.n/s.b.n;rs.push(s.t.n/s.b.n)}
dens.forEach(d=>{const m=nums.find(n=>!n.c&&n.u===d.u);if(m){m.c=1;d.c=1;m.j=d.j=pi++}});
const rn=nums.filter(n=>!n.c),rd=dens.filter(d=>!d.c);
const cell=(n,a)=>`<span>${n.d}<span class="u${n.c?' c'+(a?' a':''):''}"${n.c&&a?` style="--d:${(.3+n.j*1.3).toFixed(1)}s;--pc:${COL[n.j%4]}"`:''}>${n.u}</span></span>`;
const fr=a=>`<div class="res"><b>ปริมาณ (${p.t}) =</b><div class="cf"><div class="row">${nums.map(n=>cell(n,a)).join('<span class="op">×</span>')}</div><hr><div class="row">${dens.map(n=>cell(n,a)).join('<span class="op">×</span>')}</div></div></div>`;
const unitOk=ok&&rd.length==0&&rn.length==1&&rn[0].u==p.t;
let m;
if(g.f!=-1)m=`<div class="msg bad">ช่องแรกต้องเป็นการ์ดปริมาณสารที่โจทย์กำหนด (สีเขียว)</div>`;
else if(!ok)m=`<div class="msg bad">ตัวเศษและตัวส่วนของแต่ละแฟคเตอร์ต้องเป็นปริมาณที่เท่ากัน (อยู่ในความสัมพันธ์เดียวกัน) ลองเปลี่ยนการ์ดใหม่</div>`;
else if(!unitOk)m=`<div class="msg bad">หน่วยที่เหลือคือ ${[...rn.map(n=>n.u),...rd.map(d=>'1/'+d.u)].join(' × ')} ซึ่งไม่ตรงกับที่โจทย์ถาม (${p.t}) ลองจัดตัวเศษ-ตัวส่วนใหม่</div>`;
else{if(!st.pp[st.i]){st.pp[st.i]=1;st.score++}
m=`<div class="msg good">วางการ์ดถูกต้อง ✓ ได้ 1 คะแนน หน่วยที่เหลือคือ ${p.t} ตรงกับโจทย์ถาม เลือกคำตอบที่ถูกต้อง</div>`;
if(!st.opts){const set=[val],pool=[];for(let b=1;b<(1<<rs.length);b++){let v=g.n;rs.forEach((r,i)=>v*=(b>>i&1)?1/r:r);pool.push(v)}
pool.sort(()=>Math.random()-.5);[...pool,val*1000,val/1000,val*10,val/10].forEach(v=>{if(set.length<4&&!set.some(x=>Math.abs(x-v)<=1e-9*Math.abs(x)))set.push(v)});
st.opts=set.sort(()=>Math.random()-.5);st.ans=val}}
st.fracA=fr(true);st.fracS=fr(false);st.frac=st.fracA;st.msg=m;st.dl=(.3+pi*1.3+.2).toFixed(1);st.stage=1;st.ok=unitOk;st.fresh=true;render();st.fresh=false;st.frac=st.fracS;
}
function optsHtml(){const p=P[st.i];return `<div class="ch">${st.opts.map((v,i)=>`<button data-o="${i}" ${st.wrong.includes(i)?'class="w" disabled':''}>${fmt(v)} ${p.t}</button>`).join('')}</div>`}
function pick(i){const p=P[st.i];if(Math.abs(st.opts[i]-st.ans)<=1e-9*Math.abs(st.ans)){if(st.first){st.op[st.i]=1;st.score++}st.stage=2;st.msg=`<div class="msg good">ถูกต้อง! คำตอบคือ ${fmt(st.ans)} ${p.t} · ข้อนี้ได้ ${st.pp[st.i]+st.op[st.i]}/2 คะแนน</div>`;render()}
else{st.first=false;st.wrong.push(i);render()}}
function reset(){if(st.stage==1){st.stage=0;st.opts=null;st.wrong=[];st.frac='';st.msg=''}}
function place(id,ci){if(st.stage==2)return;const[o,k]=gs(id);o[k]=st.cards[ci];st.sel=null;reset();render()}
app.addEventListener('click',e=>{
const s=e.target.closest('[data-s]'),o=e.target.closest('[data-o]'),id=e.target.id;
if(o)return pick(+o.dataset.o);
if(id=='go')return check();
if(id=='rp'){st.frac=st.fracA;st.fresh=false;render();st.frac=st.fracS;return}
if(id=='nx'){if(st.i+1<P.length){st.i++;load()}else{st.end=1;render()}return}
if(id=='nmgo'){const n=document.getElementById('nm');if(!n.value.trim())return n.focus();st.name=n.value.trim();st.end=2;return render()}
if(id=='rs')return init();
if(id=='clr'){st.given=null;st.slots.forEach(x=>{x.t=x.b=null});st.sel=null;reset();return render()}
if(s&&st.stage<2){const sid=s.dataset.s;if(st.sel!=null)place(sid,st.sel);else{const[ob,k]=gs(sid);if(ob[k]){ob[k]=null;reset();render()}}}
});
app.addEventListener('touchstart',e=>{if(e.target.closest('.chip'))e.preventDefault()},{passive:false});
app.addEventListener('contextmenu',e=>{if(e.target.closest('.chip'))e.preventDefault()});
app.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='nm')document.getElementById('nmgo').click()});
app.addEventListener('pointerdown',e=>{
const c=e.target.closest('.chip');if(!c||st.stage==2)return;const ci=+c.dataset.c,x0=e.clientX,y0=e.clientY;let gh=null;
const mv=ev=>{if(!gh&&Math.hypot(ev.clientX-x0,ev.clientY-y0)>6){gh=c.cloneNode(true);gh.classList.add('ghost');document.body.appendChild(gh)}
